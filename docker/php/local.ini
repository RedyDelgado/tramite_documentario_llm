; El código llega por bind mount desde Windows y cada stat() cruza el puente WSL2/Hyper-V:
; con revalidate_freq=2 cada request revisa miles de archivos de vendor/ (12-14 s medidos).
; A 30 s los cambios de PHP se siguen detectando, solo con hasta medio minuto de retraso
; (mismo criterio que academico_web).
opcache.revalidate_freq = 30
realpath_cache_size = 4096K
realpath_cache_ttl = 600

memory_limit = 256M
upload_max_filesize = 50M
post_max_size = 50M

; Ningún warning de PHP debe colarse en la respuesta; los errores van al log.
display_errors = Off
log_errors = On
